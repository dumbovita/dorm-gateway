name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify Formatting & Tests
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -v -race ./...

      - name: Build Binaries
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/dorm-gateway-${TAG_NAME}-darwin-amd64 ./cmd/dorm-gateway
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/dorm-gateway-${TAG_NAME}-darwin-arm64 ./cmd/dorm-gateway
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/dorm-gateway-${TAG_NAME}-linux-amd64 ./cmd/dorm-gateway
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/dorm-gateway-${TAG_NAME}-linux-arm64 ./cmd/dorm-gateway
          cd dist
          sha256sum dorm-gateway-* > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dorm-gateway-*
            dist/checksums.txt
          generate_release_notes: true
